name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Match the release tag to the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          expected = "v" + project["version"]
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must match package version: {expected}")
          PY
      - name: Install build tools and CLI
        run: python -m pip install build twine .
      - name: Verify recorded evidence and integration tests
        run: agent-baseline verify .
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Smoke-test the built wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/agent-baseline" --help
          "$RUNNER_TEMP/wheel-test/bin/agent-baseline" skill show
          "$RUNNER_TEMP/wheel-test/bin/agent-baseline" skill install --agent codex --scope project
          test -s .agents/skills/baseline-project/SKILL.md
          test -s .agents/skills/baseline-project/references/project-record.md
          test -s .agents/skills/baseline-project/references/evaluate.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish with PyPI Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/agent-baseline/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
