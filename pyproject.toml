[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-baseline"
version = "0.2.0"
description = "Evidence-backed project guidance and verification for coding agents"
readme = "README.md"
authors = [{name = "Lemuel Boyce"}]
requires-python = ">=3.11"
dependencies = ["markdown-it-py>=3,<5", "PyYAML>=6,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/rhymiz/agent-baseline"
Repository = "https://github.com/rhymiz/agent-baseline"
Issues = "https://github.com/rhymiz/agent-baseline/issues"

[project.scripts]
agent-baseline = "agent_baseline.cli:main"

[tool.setuptools]
include-package-data = false
packages = ["agent_baseline", "agent_baseline_guidance"]
package-dir = {"" = "src", agent_baseline_guidance = "skills"}

[tool.setuptools.package-data]
agent_baseline_guidance = ["baseline-project/SKILL.md", "baseline-project/references/*.md"]
